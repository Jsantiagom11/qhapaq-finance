name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv lock --check
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy --no-incremental src
      - run: uv run pytest
      - name: Deterministic offline QCOM render
        run: |
          uv run qhapaq research \
            --record data/research/qcom/research.json \
            --manifest data/research/qcom/manifest.json \
            --output reports/generated/qcom-research-a.html \
            --result-manifest reports/generated/qcom-research.manifest.json \
            --as-of 2026-09-01
          uv run qhapaq research \
            --record data/research/qcom/research.json \
            --manifest data/research/qcom/manifest.json \
            --output reports/generated/qcom-research-b.html \
            --as-of 2026-09-01
          cmp reports/generated/qcom-research-a.html reports/generated/qcom-research-b.html
          sha256sum --check data/research/qcom/canonical-render.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: qcom-research-python-${{ matrix.python-version }}
          path: |
            reports/generated/qcom-research-a.html
            reports/generated/qcom-research.manifest.json
          if-no-files-found: error
