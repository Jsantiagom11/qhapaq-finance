[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quantancash"
version = "0.2.0"
description = "Reproducible walk-forward research for a simple cross-sectional momentum strategy."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Jorge Santiago"}]
dependencies = ["numpy>=1.24,<2.3", "pandas>=2.0,<3"]

[project.optional-dependencies]
data = ["yfinance>=0.2.40"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "pandas-stubs>=2.2"]

[project.scripts]
quantancash = "quantancash.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/quantancash"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["quantancash"]

[[tool.mypy.overrides]]
module = "yfinance"
ignore_missing_imports = true
